<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nombre</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #card { position: relative; height: 100%; width: 100%; display: flex; flex-direction: column; justify-content: center; padding: 16px 20px; overflow: hidden; }
  #content { display: flex; flex-direction: column; gap: 4px; width: 100%; }
  #title { font-size: 15px; font-weight: 600; line-height: 1.25; word-break: break-word; }
  #val { font-weight: 700; line-height: 1.05; white-space: nowrap; letter-spacing: -0.02em; }
  #desc { font-size: 13px; opacity: .75; line-height: 1.35; word-break: break-word; }
  #title:empty, #desc:empty { display: none; }
  #gear { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 18px; padding: 4px 7px; border-radius: 6px; opacity: 0; transition: opacity .15s; }
  #card:hover #gear, #gear:focus { opacity: .7; }
  #gear:hover { opacity: 1 !important; background: rgba(127,127,127,.18); }
  @media (hover: none) { #gear { opacity: .45; } }
  #err { font-size: 13px; opacity: .8; }

  #panel { position: fixed; inset: 0; background: #fff; color: #1f2937; overflow-y: auto; display: none; z-index: 10; font-size: 13px; }
  #panel.open { display: block; }
  .ph { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .ph b { font-size: 14px; }
  .pb { padding: 6px 14px 24px; }
  .sec { margin-top: 14px; }
  .sec > h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #6b7280; }
  label.f { display: block; margin-bottom: 9px; }
  label.f > span { display: block; margin-bottom: 3px; color: #374151; font-weight: 500; }
  input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; background: #fff; color: inherit; }
  textarea { resize: vertical; min-height: 54px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #60a5fa; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  input[type=color] { width: 100%; height: 32px; padding: 2px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
  .chk { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .btn { border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; color: inherit; }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  .btn.primary:hover { background: #1d4ed8; }
  .flt { border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #fafafa; }
  .flt .row { margin-bottom: 6px; }
  .flt .row:last-child { margin-bottom: 0; }
  .x { flex: 0 0 30px !important; padding: 4px 0; }
  .sw { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sw button { width: 34px; height: 26px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; font-weight: 700; font-size: 12px; }
  .hint { color: #6b7280; font-size: 12px; margin: 4px 0 0; }
</style>
</head>
<body>
<div id="card">
  <button id="gear" title="Configurer">⚙</button>
  <div id="content">
    <div id="title"></div>
    <div id="val"></div>
    <div id="desc"></div>
    <div id="err"></div>
  </div>
</div>
<div id="panel"></div>
<script src="widget.js"></script>
</body>
</html>
